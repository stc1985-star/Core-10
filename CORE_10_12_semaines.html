<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>CORE 10 — 12 semaines</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100vh;background:white}
header{padding:22px 18px 14px;background:#111827;color:white}h1{margin:0;font-size:27px}header p{margin:5px 0 0;opacity:.75}
main{padding:16px}.panel{background:#f8fafc;border-radius:18px;padding:16px;margin-bottom:14px}
button{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px;background:#111827;color:white}
button.secondary{background:#e5e7eb;color:#111827}button:disabled{opacity:.45}
.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}
.day{font-size:20px;font-weight:800}.muted{color:#6b7280}.exercise{font-size:29px;font-weight:850;margin:6px 0}
.timer{font-size:72px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-3px;margin:8px 0}
.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#111827;transition:width .2s}
.visual{height:170px;border-radius:16px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.person{font-size:68px;animation:move 1.1s ease-in-out infinite alternate}
@keyframes move{from{transform:translateY(10px) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}
.visual .label{position:absolute;bottom:9px;left:12px;font-size:12px;font-weight:700;opacity:.55}
.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;padding:11px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}
.badge{font-size:12px;font-weight:800;background:#e5e7eb;padding:5px 8px;border-radius:99px}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}
.hidden{display:none}.big{width:100%;padding:16px;font-size:18px}.center{text-align:center}
</style>
</head>
<body>
<div class="app">
<header><h1>CORE 10</h1><p>Abdos • gainage profond • lombaires</p></header>
<main>
<div class="panel">
  <div class="row">
    <div><div class="muted">Programme</div><div class="day" id="dayName">Lundi</div></div>
    <div><div class="muted">Semaine</div><select id="week" style="padding:10px;border-radius:10px;border:1px solid #ddd"></select></div>
  </div>
</div>

<div class="panel" id="workout">
  <div class="muted" id="step">Exercice 1 / 3</div>
  <div class="exercise" id="name">Crunch à la poulie</div>
  <div class="visual"><div class="person" id="person">🧍</div><div class="label">animation indicative du mouvement</div></div>
  <div class="center muted" id="target">3 × 10–15 • charge difficile</div>
  <div class="timer" id="timer">00:40</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <br>
  <div class="row">
    <button id="start">▶ DÉMARRER</button>
    <button class="secondary" id="pause">Ⅱ Pause</button>
  </div>
  <br>
  <button class="secondary big" id="next">Passer à l'exercice suivant →</button>
</div>

<div class="panel">
  <b>Programme de la semaine</b>
  <div class="list" id="list"></div>
</div>

<div class="panel">
  <b>Charge / notes</b>
  <p class="muted">Enregistre ta charge pour suivre la progression.</p>
  <input id="note" placeholder="Ex. Crunch poulie : 27,5 kg × 12">
</div>
</main>
</div>
<script>
const plans=[
 {day:"Lundi",focus:"Abdos hypertrophie",ex:[["Crunch à la poulie","40","3 × 10–15","🧎"],["Reverse crunch","40","3 × 10–15","🛌"],["Roue abdominale","40","3 × 6–12","🧎"]]},
 {day:"Mardi",focus:"Gainage profond + obliques",ex:[["Dead bug avec élastique","40","2 × 40 s","🛌"],["Pallof press à la poulie","40","2 × 10–12 / côté","🧍"],["Side plank","40","2 × 30–40 s / côté","🧍"],["RKC plank","30","2 × 20–30 s","🧎"]]},
 {day:"Mercredi",focus:"Lombaires + chaîne postérieure",ex:[["Romanian deadlift barre","40","3 × 8–10","🧍"],["Extensions lombaires","40","3 × 10–15","🧎"],["Bird dog","40","2 × 8 / côté","🧎"]]},
 {day:"Jeudi",focus:"Abdos hypertrophie",ex:[["Crunch à la poulie","40","3 × 10–15","🧎"],["Relevés de jambes","40","3 × 8–15","🧍"],["Woodchop à la poulie","40","2 × 10–12 / côté","🧍"],["Hollow body hold","30","1 × 30–40 s","🛌"]]},
 {day:"Vendredi",focus:"Core athlétique",ex:[["Roue abdominale","40","3 × 6–12","🧎"],["Suitcase carry kettlebell","40","2 × 30–40 s / côté","🧍"],["Pallof press","40","2 × 10 / côté","🧍"],["Superman contrôlé","40","1 × 40 s","🛌"]]},
 {day:"Samedi",focus:"Récupération active",ex:[["Dead bug","120","2 min","🛌"],["Bird dog","120","2 min","🧎"],["Side plank","120","2 min","🧍"],["Mobilité hanches / rachis","240","4 min","🧍"]]},
 {day:"Dimanche",focus:"Repos",ex:[["Repos","600","10 min de repos","😴"]]}
];
for(let i=1;i<=12;i++){let o=document.createElement("option");o.value=i;o.textContent="Semaine "+i;document.querySelector("#week").appendChild(o)}
let dow=(new Date().getDay()+6)%7, day=plans[dow], idx=0, remain=40, running=false, interval=null;
const $=id=>document.getElementById(id);
function render(){
  $("dayName").textContent=day.day+" — "+day.focus;
  $("step").textContent=`Exercice ${idx+1} / ${day.ex.length}`;
  $("name").textContent=day.ex[idx][0]; $("target").textContent=day.ex[idx][2];
  $("person").textContent=day.ex[idx][3]; remain=Number(day.ex[idx][1]); $("timer").textContent=fmt(remain); $("bar").style.width="0%";
  $("list").innerHTML=day.ex.map((x,i)=>`<div class="item"><span>${i+1}. ${x[0]}</span><span class="badge">${x[1]}s</span></div>`).join("");
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function tick(){
 remain--; $("timer").textContent=fmt(remain);
 let total=Number(day.ex[idx][1]); $("bar").style.width=(100*(total-remain)/total)+"%";
 if(remain<=0){beep(); if(idx<day.ex.length-1){idx++;render()}else{stop();$("timer").textContent="🎉";$("bar").style.width="100%";}}}
function beep(){try{let c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.18)}catch(e){}}
function stop(){running=false;clearInterval(interval);interval=null;$("start").textContent="▶ DÉMARRER"}
$("start").onclick=()=>{if(running)return;running=true;$("start").textContent="▶ EN COURS";interval=setInterval(tick,1000)}
$("pause").onclick=()=>{if(running){stop()}else{$("start").textContent="▶ REPRENDRE"}}
$("next").onclick=()=>{if(idx<day.ex.length-1){idx++;stop();render()}};
$("week").onchange=()=>{localStorage.setItem("coreweek",$("week").value)}
let saved=localStorage.getItem("coreweek");if(saved)$("week").value=saved;
render();
</script>
</body></html>
